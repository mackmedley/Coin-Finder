name: Deploy website

# Publishes "Coin Finder.html" as the website at
#   https://mackmedley.github.io/Coin-Finder/
# by rebuilding the gh-pages branch on every push to the app branch.
#
# Why gh-pages rather than actions/deploy-pages: the workflow token isn't
# allowed to CREATE the Pages site (configure-pages enablement fails with
# "Resource not accessible by integration"), but on a public repo a gh-pages
# branch enables Pages automatically, and pushing to it redeploys the site.

on:
  push:
    branches: [claude/meme-coin-trading-fomo-wmajvz]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site and push it to gh-pages
        run: |
          mkdir -p _site
          cp "Coin Finder.html" _site/index.html
          cp icon.png _site/icon.png
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish website from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
